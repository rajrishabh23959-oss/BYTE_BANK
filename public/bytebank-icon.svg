<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="ByteBank app icon" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F24"/><stop offset="1" stop-color="#241659"/>
    </linearGradient>
    <linearGradient id="b" gradientUnits="userSpaceOnUse" x1="330" y1="260" x2="700" y2="760">
      <stop offset="0" stop-color="#2DE2C4"/><stop offset="1" stop-color="#8B6CFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#2DE2C4" stop-opacity="0.28"/><stop offset="1" stop-color="#2DE2C4" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="sq"><rect width="1024" height="1024" rx="228"/></clipPath>
  </defs>
  <g clip-path="url(#sq)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <circle cx="512" cy="480" r="470" fill="url(#glow)"/>
    <!-- faint ledger grid -->
    <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="2">
      <path d="M0 256H1024M0 512H1024M0 768H1024M256 0V1024M512 0V1024M768 0V1024"/>
    </g>
    <rect x="3" y="3" width="1018" height="1018" rx="225" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="6"/>
  </g>
  <!-- B built from a vault bar + two asset bowls -->
  <g fill="none" stroke="url(#b)" stroke-width="92" stroke-linecap="round" stroke-linejoin="round">
    <path d="M372 292V732"/>
    <path d="M372 292H548a110 110 0 0 1 0 220H372"/>
    <path d="M372 512H582a110 110 0 0 1 0 220H372"/>
  </g>
  <!-- bytes: three bits drifting off the B -->
  <g fill="#2DE2C4">
    <rect x="716" y="268" width="44" height="44" rx="10"/>
    <rect x="780" y="332" width="30" height="30" rx="8" opacity="0.7"/>
    <rect x="742" y="384" width="20" height="20" rx="6" opacity="0.45"/>
  </g>
</svg>
